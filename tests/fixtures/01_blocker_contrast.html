<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>コントラスト・CSS変数・フォーカス欠陥サンプル</title>
  <style>
    :root {
      --bg-page: #FFFFFF;
      --low-contrast: #94A3B8;
    }
    .bad-var-text { color: var(--low-contrast); background-color: var(--bg-page); font-size: 16px; }
    button:focus { outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>お知らせ</h1>
    <p class="bad-var-text">CSS変数経由でもコントラスト比がAA基準（4.5:1）を下回っています。</p>
    <button style="width: 18px; height: 18px;">x</button>
  </main>
</body>
</html>
