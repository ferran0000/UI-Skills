<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プロジェクト設定</title>
  <style>
    :root {
      --bg-page: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --accent-primary: #1D4ED8;
      --on-accent: #FFFFFF;
    }
    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.7;
      margin: 0;
      padding: 24px;
    }
    button:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }
    .btn-primary {
      background-color: var(--accent-primary);
      color: var(--on-accent);
      min-height: 44px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
    }
    .hint {
      color: var(--text-secondary);
      background-color: var(--bg-page);
    }
  </style>
</head>
<body>
  <main>
    <h1>プロジェクト設定</h1>
    <p>チーム名と通知先メールアドレスを管理します。</p>
    <img src="team-icon.svg" alt="チームアイコン">
    <form>
      <label for="team-name">チーム名（必須）</label>
      <p id="team-name-hint" class="hint">請求書やメンバー招待メールに表示されます</p>
      <input id="team-name" type="text" aria-describedby="team-name-hint" required>
      <button type="submit" class="btn-primary">設定を保存する</button>
    </form>
    <p><a href="/docs/permissions">権限設定のガイドを見る</a></p>
  </main>
</body>
</html>
