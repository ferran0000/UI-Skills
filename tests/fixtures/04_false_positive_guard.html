<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>偽陽性ガードテスト</title>
  <style>
    :root {
      --bg-page: #FFFFFF;
      --text-primary: #0F172A;
      --focus-ring: #1D4ED8;
    }
    body { background-color: var(--bg-page); color: var(--text-primary); }
    .card { outline: none; }
    button:focus:not(:focus-visible) { outline: none; }
    button:focus-visible { outline: 2px solid var(--focus-ring); }
    .data:hover { height: 12px; }
    .input-group { width: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>設定</h1>
    <button type="button">保存する</button>
  </main>
</body>
</html>
